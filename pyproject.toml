[project]
name = "video-dubber"
version = "0.1.0"
description = "CLI tool to dub English YouTube videos into Arabic"
requires-python = ">=3.11"
dependencies = [
    "demucs>=4.0.1",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "google-genai>=2.8.0",
    "hatchling>=1.30.1",
    "httpx>=0.28.1",
    "openai>=2.41.0",
    "openai-whisper>=20250625",
    "pyannote-audio>=4.0.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "torchcodec>=0.14.0",
    "typer>=0.26.7",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
dub = "video_dubber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_dubber"]
